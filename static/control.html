<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission control</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2" />
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/tokens.css?v=20261005b" />
  <link rel="stylesheet" href="/static/home.css?v=20261005a" />
  <script src="/static/privacy.js?v=20261005a"></script>
  <script src="/static/shell.js?v=20261005b"></script>
</head>
<body class="home">
  <main class="home-main">
    <section class="readout" aria-live="polite">
      <h1 class="readout-line" id="readout">Checking…</h1>
      <p class="readout-sub"><span id="readout-next"></span><span id="readout-checked"></span></p>
    </section>

    <div class="home-grid">
      <div class="col-main">
        <section class="region" id="r-inbox" aria-labelledby="h-inbox">
          <header class="region-head">
            <h2 id="h-inbox">Needs you</h2><span class="count" id="inbox-count"></span>
            <button type="button" class="link-btn aside" id="inbox-hidden" hidden></button>
            <kbd class="jump" title="Jump here">1</kbd>
          </header>
          <ol class="rows" id="inbox-list" role="listbox" aria-labelledby="h-inbox"></ol>
        </section>

        <section class="region" id="r-next" aria-labelledby="h-next">
          <header class="region-head">
            <h2 id="h-next">Next up</h2><span class="aside">first open goal per project</span>
            <kbd class="jump" title="Jump here">2</kbd>
          </header>
          <ol class="rows" id="next-list" role="listbox" aria-labelledby="h-next"></ol>
        </section>

        <section class="region" id="r-projects" aria-labelledby="h-projects">
          <header class="region-head">
            <h2 id="h-projects">Projects</h2><span class="count" id="projects-count"></span>
            <kbd class="jump" title="Jump here">3</kbd>
          </header>
          <ol class="rows" id="project-list" role="listbox" aria-labelledby="h-projects"></ol>
        </section>
      </div>

      <aside class="col-side">
        <section class="region" id="r-agents" aria-labelledby="h-agents">
          <header class="region-head">
            <h2 id="h-agents">Agents</h2><span class="count" id="agents-count"></span>
            <kbd class="jump" title="Jump here">4</kbd>
          </header>
          <ol class="rows" id="agent-list" role="listbox" aria-labelledby="h-agents"></ol>
        </section>

        <section class="side-block" aria-labelledby="h-tonight">
          <h2 id="h-tonight">Scheduled</h2>
          <ol class="plain" id="tonight-list"></ol>
        </section>

        <section class="side-block" aria-labelledby="h-week">
          <h2 id="h-week">This week</h2>
          <div id="week"></div>
        </section>

        <section class="side-block" aria-labelledby="h-night">
          <h2 id="h-night">Last night</h2>
          <div id="last-night"></div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="keybar" id="keybar" aria-label="Keyboard hints"></footer>

  <script src="/static/home.js?v=20261005a"></script>
</body>
</html>
